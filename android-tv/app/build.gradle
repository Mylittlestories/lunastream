plugins {
    id 'com.android.application'
}

// Generate a debug keystore for signing (for CI builds)
def keystoreFile = file("keystore.properties")
def useReleaseSigning = keystoreFile.exists()

android {
    namespace 'com.lunastream.tv'
    compileSdk 34

    // CRITICAL: AAPT's default ignore pattern excludes directories starting
    // with an underscore, which silently dropped the entire Next.js "_next/"
    // asset folder from the APK (CSS/JS could never load). Override the
    // pattern WITHOUT "<dir>_*>":
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.gitignore:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    defaultConfig {
        applicationId "com.lunastream.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (useReleaseSigning) {
                def props = new Properties()
                props.load(new FileInputStream(keystoreFile))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
        // Stable debug signing: the keystore is committed to the repo so that
        // every build (local + CI) produces APKs with the SAME signature and
        // users can update in place without uninstalling.
        debug {
            storeFile rootProject.file("keystore/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (useReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "LunaStream-tv"
            def versionName = variant.versionName
            outputFileName = "${appName}-${versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
}
