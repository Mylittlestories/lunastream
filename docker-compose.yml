version: '3.8'

services:
  lunastream:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunastream
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string}
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      - lunastream-data:/app/prisma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  lunastream-data:
